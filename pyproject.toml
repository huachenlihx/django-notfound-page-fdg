[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-notfound-page-fdg"
dynamic = ["version"]
description = "Reusable, configurable Django 404 pages with optional JSON API responses"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Hua Chen" }]
keywords = ["django", "404", "not-found", "error-page", "api", "django-app"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = ["Django>=4.2,<7.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/huachenlihx/django-notfound-page-fdg"
Repository = "https://github.com/huachenlihx/django-notfound-page-fdg"
Issues = "https://github.com/huachenlihx/django-notfound-page-fdg/issues"

[tool.setuptools.dynamic]
version = { attr = "notfound_page.__version__" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["notfound_page", "notfound_page.*"]

[tool.setuptools.package-data]
notfound_page = ["templates/*.html", "templates/notfound_page/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
