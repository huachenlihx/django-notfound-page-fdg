name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.9", django: "Django~=4.2.0" }
          - { python: "3.10", django: "Django~=4.2.0" }
          - { python: "3.10", django: "Django~=5.2.0" }
          - { python: "3.11", django: "Django~=5.2.0" }
          - { python: "3.12", django: "Django~=5.2.0" }
          - { python: "3.13", django: "Django~=5.2.0" }
          - { python: "3.12", django: "Django>=6.0,<7.0" }
          - { python: "3.13", django: "Django>=6.0,<7.0" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        env:
          DJANGO_SPEC: ${{ matrix.django }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" "$DJANGO_SPEC"
          python -m pip check
      - name: Django checks and tests
        env:
          DJANGO_SETTINGS_MODULE: tests.settings
        run: |
          python -m django check
          python -m django test tests --verbosity 2
